name: berth

services:
  berth:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: berth:1.0
    container_name: berth
    ports:
      - "127.0.0.1:9000:8000"
    environment:
      - BERTH_HOST=0.0.0.0
      - BERTH_PORT=8000
      - BERTH_MODEL=yolo26s_classify
      - BERTH_API_KEY=${BERTH_API_KEY:-}
      - BERTH_ADMIN_PASSWORD=${BERTH_ADMIN_PASSWORD:-}   # required for admin login (else /api/auth/login → 503)
      - BERTH_AUTH_SECRET=${BERTH_AUTH_SECRET:-}         # optional: persist token signing across restarts
      - BERTH_EPOCHS=30
      - BERTH_BATCH_SIZE=64
      - BERTH_CAPTURE_DIR=/app/captures
    volumes:
      - ../../backend/data:/app/data
      - ../../backend/models:/app/models
      - ../../backend/outputs:/app/outputs
      - ../../backend/uploads:/app/uploads
      - ../../captures:/app/captures
    restart: unless-stopped
