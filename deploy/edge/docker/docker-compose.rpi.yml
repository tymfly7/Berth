services:
  berth-rpi:
    image: berth-rpi:latest
    build:
      context: ../../..
      dockerfile: deploy/edge/docker/Dockerfile.rpi
      platforms:
        - linux/arm64
    environment:
      - BERTH_DEPLOYMENT=edge
      - BERTH_MODEL=cnn_scratch
      - BERTH_API_KEY=${BERTH_API_KEY:-}
      - BERTH_ADMIN_PASSWORD=${BERTH_ADMIN_PASSWORD:-}   # required for admin login (else /api/auth/login → 503)
      - BERTH_AUTH_SECRET=${BERTH_AUTH_SECRET:-}         # optional: persist token signing across restarts
      - BERTH_PORT=8000
      - BERTH_DB_PATH=/app/edge_data/berth.db
      # Pi 5 (quad A76) — cap concurrent decode+inference loops. Room for a USB
      # webcam alongside two existing feeds; lower to 2 or deactivate a feed if
      # the board struggles.
      - BERTH_MAX_ACTIVE_CAMERAS=3
      # Force RTSP over TCP (avoids H264 packet loss / corrupt macroblocks on
      # UDP). Keeps the app's YouTube/HLS tuning; rtsp_transport is ignored by
      # non-RTSP sources.
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|multiple_requests;0|fflags;nobuffer|live_start_index;-3|probesize;500000|analyzeduration;500000|reconnect;1|reconnect_streamed;1|reconnect_delay_max;5
    volumes:
      - berth_rpi_data:/app/edge_data      # persistent SQLite database
      - berth_rpi_config:/app/configs      # ROIs + camera registry — created on first run, survives rebuilds
      - /dev:/dev                          # host device nodes, incl. webcams plugged in after start
    device_cgroup_rules:
      - 'c 81:* rmw'                       # V4L2 (major 81): allow any /dev/videoN, none need exist at boot
    ports:
      - "8001:8000"   # match the Pi (host 8001 → container 8000)
    restart: unless-stopped

volumes:
  berth_rpi_data:
  berth_rpi_config:
