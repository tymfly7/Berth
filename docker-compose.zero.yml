# Raspberry Pi Zero 2 W profile — same arm64 image as the Pi 5, different tuning.
#
# The Zero 2 W is a quad-core Cortex-A53 with only 512 MB RAM, far weaker than the
# Pi 5. It runs the identical berth-rpi:latest image (built from Dockerfile.rpi);
# the board differences live entirely in the env below. One model is loaded at a
# time and the whole stack is torch-free (NCNN), so it fits the memory budget.
#
# Build/transfer the image exactly as for the Pi 5, then on the Zero 2 W:
#   docker compose -f docker-compose.zero.yml up -d
services:
  berth-zero:
    image: berth-rpi:latest
    build:
      context: .
      dockerfile: Dockerfile.rpi
      platforms:
        - linux/arm64
    environment:
      - BERTH_DEPLOYMENT=edge
      - BERTH_MODEL=cnn_scratch
      - BERTH_API_KEY=${BERTH_API_KEY:-}
      - BERTH_ADMIN_PASSWORD=${BERTH_ADMIN_PASSWORD:-}   # required for admin login (else /api/auth/login → 503)
      - BERTH_AUTH_SECRET=${BERTH_AUTH_SECRET:-}         # optional: persist token signing across restarts
      - BERTH_PORT=8000
      - BERTH_DB_PATH=/app/edge_data/berth.db
      # ── Zero 2 W tuning (512 MB / Cortex-A53) — override the edge defaults ──
      - BERTH_FRAME_WIDTH=640
      - BERTH_FRAME_HEIGHT=360
      - BERTH_STREAM_FPS=6
      - BERTH_INFER_FPS=1.5
      - BERTH_ANOMALY_FPS=0.2
      - BERTH_MAX_ACTIVE_CAMERAS=2
    volumes:
      - berth_zero_data:/app/edge_data      # persistent SQLite database
      - berth_zero_config:/app/configs      # ROIs + camera registry — survives rebuilds
    devices:
      - /dev/video0:/dev/video0            # USB webcam passthrough (only present on the Pi)
    ports:
      - "8001:8000"   # host 8001 → container 8000
    restart: unless-stopped
    mem_limit: 450m          # hard cap — keep the stack inside the 512 MB board
    mem_reservation: 350m    # soft floor for the scheduler

volumes:
  berth_zero_data:
  berth_zero_config:
